name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistemske biblioteke
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Buildozer i Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv

      - name: Kes buildozer foldera
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Prihvati Android SDK licence
        run: |
          grep -q "^android.accept_sdk_license" buildozer.spec || \
            sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec

      - name: Build APK
        run: buildozer -v android debug

      - name: Sacuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: SopingLista-apk
          path: bin/*.apk
