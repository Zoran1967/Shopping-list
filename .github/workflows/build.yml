name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Raspakuj app.zip
        run: |
          ls -la
          Z=$(ls *.zip | head -1)
          echo "Koristim: $Z"
          rm -rf app
          unzip -q -o "$Z" -d app
          find app -type f | sort

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistemske biblioteke
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer virtualenv

      - name: Kes
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK
        run: buildozer -v android debug

      - name: Sacuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: SopingLista-apk
          path: bin/*.apk
